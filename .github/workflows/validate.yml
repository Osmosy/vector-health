name: validate

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  repo:
    name: Валидация библиотеки и документации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Валидация репозитория (числа, лицензии, ссылки, диаграмма)
        run: python3 scripts/validate.py

      - name: Проверка актуальности каталога навыков
        run: |
          python3 scripts/build_index.py
          git diff --exit-code skills-index.json \
            || (echo "::error::skills-index.json устарел — пересобери scripts/build_index.py" && exit 1)

      - name: Ссылки внутри навыков — у собственных битых быть не должно
        run: python3 scripts/broken_refs.py --strict-own

      - name: Тесты скриптов
        run: python3 tests/test_scripts.py

      - name: Проверка диаграммы (спецификация валидна, HTML воспроизводим)
        run: |
          if [ ! -d archify ]; then
            echo "archify не установлен — проверка диаграммы пропущена (это не ошибка)"
            exit 0
          fi
          node archify/bin/archify.mjs validate architecture \
            docs/vector-health.architecture.json --quality showcase --json
