name: validate

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  repo:
    name: Валидация библиотеки и документации
    runs-on: ubuntu-latest
    env:
      # Версия archify пришпилена: проверка диаграммы должна быть воспроизводимой,
      # а не зависеть от того, что сегодня в HEAD апстрима.
      ARCHIFY_VERSION: v2.16.0
      # Токен для обращений к GitHub API. Без него дерево апстрима не приходит
      # (анонимный лимит 60 запросов в час), и scripts/broken_refs.py корректно
      # отказывается перезаписывать отчёт деградировавшими числами — сборка падала бы
      # не по делу. Скрипты читают токен из окружения (refs.github_token).
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Ставится ДО валидатора: он проверяет, что спецификация диаграммы
      # согласована с доставленным HTML, а HTML пересобирается ниже. Без
      # установленного archify проверка диаграммы в валидаторе сообщает о
      # неполноте, а не молчит.
      - name: Установка archify (пришпиленная версия)
        run: bash scripts/install-archify.sh archify

      - name: Валидация репозитория (числа, лицензии, ссылки, диаграмма)
        run: python3 scripts/validate.py

      # Числа из stats.json в четырёх документах: отдельным шагом, чтобы в логе
      # было видно, какое именно число разъехалось и на что его менять.
      - name: Числа в документах совпадают со stats.json
        run: python3 scripts/sync_doc_numbers.py --check

      - name: Проверка актуальности каталога навыков
        run: |
          python3 scripts/build_index.py
          git diff --exit-code skills-index.json \
            || (echo "::error::skills-index.json устарел — пересобери scripts/build_index.py" && exit 1)

      # --no-report обязателен: без него шаг пересобирает docs/broken-refs.md, и его
      # хеш расходится с записанным в docs/for-review.md (49863 против 49764) —
      # проверка «for-review собран из дерева» падала на следующем шаге. Отчёт в
      # репозитории — закоммиченный артефакт; пересобирать его в CI и сравнивать
      # хеши с ним же бессмысленно.
      - name: Ссылки внутри навыков — у собственных битых быть не должно
        run: python3 scripts/broken_refs.py --strict-own --no-report

      # Тесты идут БЕЗ сети: деревья апстримов берутся из снимка
      # tests/fixtures/upstream-trees.json.gz. Раньше они падали в API GitHub, и в
      # офлайне валилась проверка «общий/чужой файл» (пустое дерево), а не
      # пропускалась с пометкой.
      # Без сети НА САМОМ ДЕЛЕ. Раньше шаг назывался «без сети», хотя сеть была, и
      # подпроцесс broken_refs.py в неё ходил — проверка ничего не доказывала.
      #
      # Контейнер выбран вместо `unshare -n` потому, что на раннере GitHub
      # непривилегированный `unshare` не работает; но он же и дороже: образ
      # `python:3.12` тянется при каждом прогоне (12+ минут на шаг, из-за чего
      # прогон затягивался). Контейнер — только когда нужен НАСТОЯЩИЙ сетевой
      # запрет; для остального достаточно офлайн-контракта (VH_OFFLINE), который
      # тесты проверяют отдельно и быстро.
      - name: Тесты скриптов с офлайн-контрактом (быстро)
        run: python3 -B tests/run_offline.py

      - name: Тесты скриптов в окружении без сети (контейнер)
        # Образ кэшируется между прогонами, если его не тянуть заново каждый раз
        run: |
          docker pull --quiet python:3.12 || true
          docker run --rm --network none -v "$PWD":/w -w /w python:3.12 \
            python3 -B tests/run_offline.py

      - name: Строгая проверка собственных навыков без сети
        run: |
          docker run --rm --network none -v "$PWD":/w -w /w python:3.12 \
            python3 -B scripts/broken_refs.py --strict-own --no-report

      - name: Тесты со сверкой апстримов по сети
        run: python3 tests/test_scripts.py --network

      # Проверка проверок: каждая мутация (служебный файл, год испытания, цифры
      # соседнего испытания, категория ссылок) обязана ронять валидатор. Валидатор,
      # не падающий на испорченных данных, ничего не проверяет.
      - name: Мутационные проверки
        run: python3 tests/mutation_check.py

      # for-review.md называет коммит, на котором собран, поэтому в клоне он ВСЕГДА
      # ссылается на предыдущий коммит — это структурно неизбежно, и проверка
      # «файл воспроизводится» здесь падала бы по причине, не относящейся к делу.
      # Проверяем то, что важно: хеши и числа в файле совпадают с содержимым этого
      # рабочего дерева (строку с коммитом сравнение и так исключает).
      - name: docs/for-review.md собран из текущего дерева
        run: |
          python3 scripts/build_for_review.py --check \
            || { echo "::error::docs/for-review.md устарел — пересобери scripts/build_for_review.py и закоммить вместе с правками"; exit 1; }

      - name: Карточка Vector Health на сайте экосистемы совпадает со stats.json
        run: python3 scripts/build_hub_card.py --check "$HOME/projects/vector-hub/index.html"
        continue-on-error: true   # репозитория сайта в CI нет — проверка локальная

      # Две ступени для диаграммы: (1) спецификация проходит showcase-проверку,
      # (2) доставленный HTML воспроизводится из спецификации — иначе «живая»
      # диаграмма тихо расходится с тем, что лежит в docs/.
      #
      # Сравнение — через scripts/check_diagram.py, а не `cmp`: в артефакт
      # вписывается версия рендерера (`archify X.Y.Z`), и локальная сборка
      # отличается от CI ровно этой строкой. Побайтовое сравнение валило бы
      # сборку при каждом обновлении archify, ничего не сообщая о содержимом.
      - name: Доставленный HTML воспроизводится из спецификации
        run: |
          node archify/bin/archify.mjs deliver architecture \
            docs/vector-health.architecture.json /tmp/rebuilt.html \
            --quality showcase --json
          python3 scripts/check_diagram.py \
            docs/vector-health.architecture.html /tmp/rebuilt.html
